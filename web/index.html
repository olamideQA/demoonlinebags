<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Discover exquisite ladies handbags, structured totes, evening minaudières, and complementary sculpted footwear handcrafted for timeless elegance.">
  <meta name="theme-color" content="#121212">

  <!-- Open Graph -->
  <meta property="og:title" content="DEMO ONLINE BAGS | Luxury Handbags & Footwear">
  <meta property="og:description" content="Impeccable craftsmanship in full-grain Italian leathers and sculptured silhouettes.">
  <meta property="og:type" content="website">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DemoBags">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DEMO ONLINE BAGS | Luxury Handbags, Clutches & Designer Footwear</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #FAFAF9;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #FAFAF9;
      transition: opacity 0.5s ease-out;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(197, 168, 128, 0.2);
      border-top-color: #C5A880;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .brand-sub {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C5A880;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="brand-title">DEMO ONLINE BAGS</div>
    <div class="brand-sub">LUXURY ATELIER</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Remove loading indicator when Flutter initializes
      var indicator = document.getElementById('loading-indicator');
      if (indicator) {
        setTimeout(function() {
          indicator.style.opacity = '0';
          setTimeout(function() {
            if (indicator.parentNode) {
              indicator.parentNode.removeChild(indicator);
            }
          }, 500);
        }, 1200);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
